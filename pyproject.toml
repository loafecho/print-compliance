[project]
name = "print-compliance-engine"
version = "0.1.0"
description = "File-level 3D-print compliance screening: functional-geometry feature detection + rule scoring (Phase 1)"
readme = "README.md"
authors = [
    { name = "Tony Garcia", email = "180770769+loafecho@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "manifold3d>=3.5.4",
    "mapbox-earcut>=2.1.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "trimesh>=5.1.0",
]

[project.scripts]
pce = "pce.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "pce"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
