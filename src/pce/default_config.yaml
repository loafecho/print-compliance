# print-compliance-engine default configuration (Phase 1).
# Units are millimetres. This is a SCREENING config: it flags combinations of
# generic geometric signals for human review. It is not a weapon specification.

caliber_bands:
  # Generic, publicly known nominal bore diameters (mm). A bore "matches" when
  # its measured diameter is within +/- tolerance_mm of any nominal value.
  nominal_mm: [5.56, 7.62, 9.0, 11.43]
  tolerance_mm: 0.3

bore_detection:
  max_slices_per_axis: 240     # cross-sections taken along each candidate axis
  min_step_mm: 0.25            # finest slice spacing
  max_circle_deviation: 0.04   # max |r_i - R| / R for a ring to count as a circle
  min_area_ratio: 0.86         # ring area / (pi R^2); rejects hexagons/squares
  min_diameter_mm: 1.0         # ignore tiny loops (tessellation noise)
  min_track_slices: 3          # a bore must persist across >= this many slices
  step_change_mm: 0.4          # adjacent-slice diameter jump that counts as a step...
  step_change_rel: 0.06        # ...or this fraction of the diameter, whichever is larger
  min_segment_mm: 2.0          # a constant-diameter plateau must be at least this long
  merge_gap_diameters: 2.0     # join collinear same-diameter bore pieces split by a cross-hole
                               # gap of up to this many diameters (closes a split-the-bore evasion)
  # Fail-closed analysis caps: exceeding any of these sends the body to REVIEW
  # (bore_error) instead of letting it read as "no bore found".
  max_step_mm: 4.0             # coarsest slice spacing allowed, whatever the body's extent
  max_total_slices: 2000       # bodies that need more slices than this at max_step_mm -> REVIEW
  max_loops_per_section: 500   # closed loops in one cross-section
  max_circles_per_axis: 20000  # circular sections collected along one axis

scoring:
  # ruleset: "combination" (default) or "single_signal" (naive baseline kept
  # only so the FP report can show what combination logic buys).
  ruleset: combination
  ld_review: 8.0     # length/diameter ratio that counts as a "long bore" signal
  ld_block: 12.0     # length/diameter ratio required (with the other signals) for BLOCK
  # A stepped bore only corroborates a caliber-band match for REVIEW when the bore is
  # at least this many diameters long. Added after the v0 baseline, tuned on the
  # corpus TUNE half only (short counterbores / bearing seats). v0 behaviour = 0.0.
  ld_stepped_review: 3.0
  # If false, geometry signals alone can never BLOCK: a full-signal match becomes a
  # PRIORITY REVIEW and only an exact blocklist hit blocks. See reports/fp-floor.md.
  geometry_can_block: false   # since 2026-10-01: shape alone may only send to REVIEW; only exact blocklist hits BLOCK
  non_watertight: review   # "review" or "note": what to do when a body is not watertight

limits:
  # Per-file input and work bounds. Anything over a limit is not analysed and is
  # sent to REVIEW, so a hostile file cannot stall or exhaust a batch scan.
  max_file_mb: 100             # file size on disk
  max_uncompressed_mb: 512     # total declared uncompressed size of a 3MF package
  max_bodies: 256              # bodies (3MF build instances / STL solids) per file
  max_faces: 2000000           # total triangles per file
  scan_seconds: 120            # wall-clock budget for bore analysis of one file

blocklist_path: blocklist.txt   # exact-match geohash blocklist (starts empty)
audit_log_path: audit/scan-log.jsonl
